# docker-compose.yml
# Локальное окружение для разработки
#
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Логи:      docker compose logs -f

services:
  # ---------------------------------------------------------------------------- #
  # PostgreSQL
  # ---------------------------------------------------------------------------- #
  postgres:
    container_name: "mom_blplt_postgres"
    image: "postgres:15.1-alpine"
    restart: "unless-stopped"
    ports:
      - "5429:5432"
    environment:
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_DB: "test_db"
    volumes:
      - "mom_blplt_postgres_data:/var/lib/postgresql/data"
    networks:
      - "mom_blplt_net"
    healthcheck:
      test: ["CMD-SHELL", "pg_is_ready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------- #
# Volumes
# ---------------------------------------------------------------------------- #
volumes:
  mom_blplt_postgres_data: {}

# ---------------------------------------------------------------------------- #
# Networks
# ---------------------------------------------------------------------------- #
networks:
  mom_blplt_net: {}
